spring:
  datasource:
    hikari:
      jdbc-url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:contacts_dev}
      username: ${DB_USER:contacts_dev_user}
      password: ${DB_PASS:contacts_dev_password}
      driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25

logging:
  level:
    root: INFO
    com.mycompany.contact_app: DEBUG
    org.hibernate.SQL: DEBUG

# Notes:
# - Hikari properties use the same placeholders as application.yml (DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASS).
# - When running tests with the 'dev' profile you can override these via -DDB_USER/DB_PASS/DB_NAME or environment variables.
spring:
  datasource:
    username: ${DB_USER}
    password: ${DB_PASS}
    hikari:
      jdbc-url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
      maximum-pool-size: 50
      minimum-idle: 10
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Strict production logging configurations
logging:
  level:
    root: INFO
    com.mycompany.contact_app: INFO
    org.hibernate: WARN
    org.springframework.boot.actuate: DEBUG
    org.springframework.boot.actuate.endpoint.web: DEBUG
    org.springframework.boot.actuate.health: DEBUG

server:
  error:
    include-stacktrace: never # Prevent stack traces from exposing system internals